# Runs on the test server. IMAGE and TAG come from the .env file written by scripts/deploy.sh.
name: hello-nginx

x-logging: &logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "3"

services:
    app:
        image: ${IMAGE}:${TAG}
        restart: unless-stopped
        ports:
            - "8080:8080"
        logging: *logging

    nginx-exporter:
        image: nginx/nginx-prometheus-exporter:1.3.0
        restart: unless-stopped
        command:
            - --nginx.scrape-uri=http://app:8081/stub_status
        depends_on:
            - app
        logging: *logging

    prometheus:
        image: prom/prometheus:v2.53.0
        restart: unless-stopped
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus-data:/prometheus
        # only reachable from the server itself (use an SSH tunnel to open it)
        ports:
            - "127.0.0.1:9090:9090"
        logging: *logging

volumes:
    prometheus-data:
