log_format json escape=json '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"duration":$request_time,'
    '"user_agent":"$http_user_agent"'
'}';

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}

# internal port for the Prometheus exporter; not published outside the Docker network
server {
    listen 8081;

    location = /stub_status {
        stub_status;
        access_log off;
    }
}
